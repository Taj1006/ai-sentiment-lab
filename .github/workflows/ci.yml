name: CI - Tests and container health

on:
  push:
    branches: [main, "portfolio/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Dependency-free unit tests
        run: python3 -B -m unittest discover -s tests -v

      - name: Build application image
        run: docker build -t ai-sentiment-lab:test .

      - name: Test real dependencies and Streamlit rendering in the image
        run: |
          docker run --rm --entrypoint python \
            --mount "type=bind,source=$PWD/tests,target=/app/tests,readonly" \
            -e RUN_DEPENDENCY_TESTS=1 \
            ai-sentiment-lab:test -B -m unittest discover -s tests -v

      - name: Start application on runner loopback only
        run: |
          docker run -d --name sentiment-ci \
            -p 127.0.0.1:8501:8501 ai-sentiment-lab:test

      - name: Require a healthy container within 60 seconds
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            state=$(docker inspect --format '{{.State.Status}}' sentiment-ci)
            health=$(docker inspect --format '{{.State.Health.Status}}' sentiment-ci)
            if [ "$state" != running ] || [ "$health" = unhealthy ]; then
              echo "Container stopped or failed its health check."
              exit 1
            fi
            if [ "$health" = healthy ]; then
              curl --fail --silent --show-error --max-time 3 http://127.0.0.1:8501/_stcore/health
              exit 0
            fi
            sleep 2
          done
          echo "Application did not become healthy before the deadline."
          exit 1

      - name: Show container diagnostics on failure
        if: failure()
        run: |
          docker logs sentiment-ci || true
          docker inspect --format '{{json .State}}' sentiment-ci || true

      - name: Clean up test container
        if: always()
        run: docker rm -f sentiment-ci 2>/dev/null || true
